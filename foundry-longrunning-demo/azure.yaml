# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: ">=1.27.1"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.9"
name: langchain-azure-resilient-responses
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: "2026-03-17"
        sku:
          name: GlobalStandard
          capacity: 10
      - name: gpt-5.6-sol
        model:
          format: OpenAI
          name: gpt-5.6-sol
          version: "2026-07-09"
        sku:
          name: DataZoneStandard
          capacity: 300
      - name: gpt-5.6-terra
        model:
          format: OpenAI
          name: gpt-5.6-terra
          version: "2026-07-09"
        sku:
          name: DataZoneStandard
          capacity: 300
      - name: gpt-5.6-luna
        model:
          format: OpenAI
          name: gpt-5.6-luna
          version: "2026-07-09"
        sku:
          name: DataZoneStandard
          capacity: 300

  langchain-azure-resilient-responses-steerable:
    host: azure.ai.agent
    metadata:
      tags:
        - AI Agent Hosting
        - Responses Protocol
        - LangGraph
        - LangChain
        - Long-Running
        - Resilient Tasks
        - Steering
        - Human-in-the-Loop
        - Python
    project: src/langchain-azure-resilient-responses
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: '-m langchain_azure_ai.agents.hosting.run --protocol responses --option resilient_background=true --option steerable_conversations=true'
    uses:
      - ai-project
    kind: hosted
    name: langchain-azure-resilient-responses-steerable
    displayName: Resilient Trip Advisor
    description: Japanese private and business Trip Advisor with web-grounded flights, hotels, activities, durable checkpoints, in-flight steering, optional booking approval, and crash recovery.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
infra:
  provider: microsoft.foundry
