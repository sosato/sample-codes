# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: maf
services:
    harness-proj:
        host: azure.ai.project
        endpoint: https://harness-foundry-92361.services.ai.azure.com/api/projects/harness-proj
    three-step-maf:
        project: .
        host: azure.ai.agent
        language: python
        uses:
            - harness-proj
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: three-step-maf
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
